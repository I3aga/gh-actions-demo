# имя workflow, отображается во вкладке Actions
name: CI

# события, которые запускают workflow
on:
  # запуск при пуше в любую ветку
  push:
  # запуск при открытии или обновлении пул-реквеста
  pull_request:

# список джобов, которые выполнит workflow
jobs:
  # джоба с произвольным названием test
  test:
    # образ раннера — свежий Ubuntu от GitHub
    runs-on: ubuntu-latest
    # последовательность шагов внутри джобы
    steps:
      # шаг 1: скачиваем код репозитория на раннер
      - name: Checkout
        uses: actions/checkout@v7

      # шаг 2: ставим Node.js нужной версии
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # версия Node.js для раннера
          node-version: '22'

      # шаг 3: устанавливаем зависимости проекта
      - name: Install dependencies
        run: npm ci

      # шаг 4: запускаем тесты
      - name: Run tests
        run: npm test
